<title>Adam và Eva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one fixed 960x540 stage scaled to fit the screen. Canvas draws the world; DOM draws the title, buttons and hints. */
:root{--night:#2b1a10;--cream:#fff3cf;--sun:#ffd23f;--ember:#e8531f;--leaf:#2f9e44;--ink:#4a250c;--sky:#8be0f7;--edge:#5a2d0c;
--display:'Chewy','Baloo 2',cursive;--body:'Baloo 2',system-ui,sans-serif}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--night);color:var(--ink);font-family:var(--body);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:960px;height:540px;flex:none;overflow:hidden;border-radius:18px;background:var(--sky);box-shadow:0 0 0 6px var(--edge)}
canvas{position:absolute;left:0;top:0;width:960px;height:540px;display:block;touch-action:none}
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:10px;pointer-events:none}
#title>*{pointer-events:auto}
.logo{display:flex;align-items:flex-end;justify-content:center;font-family:var(--display);font-size:108px;line-height:1;filter:drop-shadow(0 8px 0 rgba(90,45,12,.55))}
.logo span{display:inline-block;-webkit-text-stroke:10px var(--edge);paint-order:stroke fill;animation:bob 1.7s ease-in-out infinite;transform-origin:50% 100%}
.logo .amp{font-size:86px;margin:0 10px 8px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-12px) rotate(calc(var(--r) * -1))}}
.sub{margin-top:0;font-family:var(--display);font-size:31px;color:#fff;-webkit-text-stroke:7px var(--edge);paint-order:stroke fill;letter-spacing:1px}
.play{margin-top:12px;font-family:var(--display);font-size:48px;color:#fff;padding:0 58px 8px;border:0;border-radius:60px;cursor:pointer;background:radial-gradient(circle at 30% 25%,#a8ee6c,#2f9e44 60%,#1f7a33);box-shadow:0 8px 0 #145a24,0 14px 18px rgba(0,0,0,.35),inset 0 4px 8px rgba(255,255,255,.55);-webkit-text-stroke:6px #145a24;paint-order:stroke fill;animation:pulse 1.3s ease-in-out infinite}
.play:hover{filter:brightness(1.1)}
.play:active{transform:translateY(5px);box-shadow:0 3px 0 #145a24}
.play:focus-visible,.icon:focus-visible,.slot:focus-visible{outline:4px solid #fff;outline-offset:3px}
@keyframes pulse{50%{transform:scale(1.07)}}
.how{position:absolute;right:16px;bottom:16px;width:244px;background:var(--cream);border:4px solid var(--edge);border-radius:20px;padding:6px 14px 10px;font-size:15px;line-height:1.22;font-weight:600;box-shadow:0 6px 0 rgba(90,45,12,.5);transform:rotate(1.5deg)}
.how h3{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:24px;color:var(--ember)}
.how ul{margin:0;padding-left:18px}
.how li{margin-bottom:2px}
#hud{position:absolute;inset:0;pointer-events:none}
#hud>*{pointer-events:auto}
.pill{position:absolute;top:8px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--display);font-size:27px;color:#fff;-webkit-text-stroke:7px var(--edge);paint-order:stroke fill;pointer-events:none!important}
.icon{position:absolute;top:10px;width:46px;height:46px;border-radius:50%;border:4px solid var(--edge);background:var(--cream);cursor:pointer;display:grid;place-items:center;box-shadow:0 4px 0 rgba(90,45,12,.6);padding:0}
.icon:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,45,12,.6)}
#mute{right:14px}
#retry{right:68px}
#bagBtn{left:14px;bottom:14px;top:auto;width:66px;height:66px}
#bagBtn.bounce{animation:pulse .5s ease-in-out 3}
#bagBtn.nudge{animation:pulse 1s ease-in-out infinite}
#mute.off .wave{display:none}
#bagPanel{position:absolute;left:14px;bottom:92px;background:var(--cream);border:4px solid var(--edge);border-radius:18px;padding:6px 12px 10px;display:none;box-shadow:0 5px 0 rgba(90,45,12,.5)}
#bagPanel.open{display:block}
#bagPanel p{margin:0 0 4px;font-family:var(--display);font-size:20px;color:var(--ember)}
.slot{width:92px;height:64px;border-radius:12px;background:#ead6a6;border:3px dashed #a8742c;display:grid;place-items:center;cursor:grab;padding:0}
.slot:empty{cursor:default}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);max-width:600px;text-align:center;background:var(--cream);border:4px solid var(--edge);border-radius:30px;padding:2px 22px 4px;font-size:20px;font-weight:800;box-shadow:0 5px 0 rgba(90,45,12,.5);pointer-events:none!important}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:rgba(255,226,120,.38)}
#end.show{display:flex}
#end .big{font-family:var(--display);font-size:92px;line-height:1;color:#ffe066;-webkit-text-stroke:11px var(--edge);paint-order:stroke fill;filter:drop-shadow(0 8px 0 rgba(90,45,12,.55));animation:bob 1.6s ease-in-out infinite;--r:-2deg}
#end .msg{font-family:var(--display);font-size:34px;color:#fff;-webkit-text-stroke:7px var(--edge);paint-order:stroke fill}
.bub{position:absolute;bottom:-60px;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.8),rgba(255,255,255,.12) 55%);pointer-events:none;animation:rise linear infinite}
@keyframes rise{to{transform:translate(var(--dx),-640px)}}
@media (prefers-reduced-motion:reduce){.logo span,.play,.bub,#end .big{animation:none}}
</style>

<div id="wrap"><div id="stage">
<canvas id="cv"></canvas>

<div id="title">
  <div class="logo" aria-label="Adam và Eva">
    <span style="--r:-4deg;color:#ff6b6b;animation-delay:0s">A</span><span style="--r:3deg;color:#ffd23f;animation-delay:.12s">d</span><span style="--r:-3deg;color:#7bd957;animation-delay:.24s">a</span><span style="--r:4deg;color:#4dc3ff;animation-delay:.36s">m</span><span class="amp" style="--r:-6deg;color:#ff9ff3;animation-delay:.48s">&amp;</span><span style="--r:3deg;color:#ffd23f;animation-delay:.6s">E</span><span style="--r:-4deg;color:#ff6b6b;animation-delay:.72s">v</span><span style="--r:3deg;color:#7bd957;animation-delay:.84s">a</span>

<div id="hud" hidden>
  <div class="pill" id="lvName"></div>
  <button class="icon" id="retry" aria-label="Chơi lại màn này"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#5a2d0c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5"/></svg></button>
  <button class="icon" id="mute" aria-label="Bật tắt âm thanh"><svg width="26" height="26" viewBox="0 0 24 24" fill="#5a2d0c" stroke="#5a2d0c" stroke-width="2" stroke-linejoin="round"><path d="M3 9v6h4l5 4V5L7 9z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M19 5.5a9 9 0 0 1 0 13" fill="none" stroke-linecap="round" stroke-width="2.6"/></svg></button>
  <button class="icon" id="bagBtn" hidden aria-label="Mở túi đồ"><svg width="46" height="46" viewBox="0 0 48 48"><path d="M16 10c2-5 14-5 16 0l-3 5H19z" fill="#c98b3b" stroke="#5a2d0c" stroke-width="3" stroke-linejoin="round"/><path d="M14 17h20c7 6 9 14 6 21-2 4-6 5-16 5S10 42 8 38c-3-7-1-15 6-21z" fill="#e0a24a" stroke="#5a2d0c" stroke-width="3" stroke-linejoin="round"/><path d="M17 24c4 3 10 3 14 0" fill="none" stroke="#5a2d0c" stroke-width="3" stroke-linecap="round"/><circle cx="24" cy="31" r="3.2" fill="#fff3cf" stroke="#5a2d0c" stroke-width="2"/></svg></button>
  <div id="bagPanel"><p>Túi đồ</p><div class="slot" id="slotKnife" tabindex="0" aria-label="Dao đá, kéo ra để dùng"><svg width="76" height="46" viewBox="0 0 76 46"><path d="M8 30L44 9c8-2 18 2 24 10-9 3-18 9-34 17z" fill="#b9c0c7" stroke="#5a2d0c" stroke-width="3" stroke-linejoin="round"/><path d="M14 28L46 12" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".7"/><rect x="2" y="29" width="20" height="9" rx="4" transform="rotate(-28 12 34)" fill="#a0642a" stroke="#5a2d0c" stroke-width="3"/></svg></div></div>
  <div class="hint" id="hint"></div>
</div>
<div id="end"><div class="big">CHIẾN THẮNG!</div><div class="msg">Adam và Eva đã đoàn tụ</div><button class="play" id="again" style="font-size:38px;margin-top:14px">CHƠI LẠI</button></div>
</div></div>

<script>
'use strict';
/* ---------- Audio: cheerful looping music + sound for every action (WebAudio, no files) ---------- */
const AU={c:null,muted:false,master:null,mus:null,sfx:null,nb:null};
function auInit(){
  if(AU.c){ if(AU.c.state==='suspended') AU.c.resume(); return; }
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  const c=AU.c=new C();
  AU.master=c.createGain(); AU.master.gain.value=AU.muted?0:.85; AU.master.connect(c.destination);
  AU.mus=c.createGain(); AU.mus.gain.value=.30; AU.mus.connect(AU.master);
  AU.sfx=c.createGain(); AU.sfx.gain.value=.9; AU.sfx.connect(AU.master);
  const len=c.sampleRate; AU.nb=c.createBuffer(1,len,c.sampleRate); const d=AU.nb.getChannelData(0);
  for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
  nextT=c.currentTime+.1; setInterval(sched,60);
}
function toneAt(f,t,dur,type,vol,dest,slide){
  const c=AU.c; if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(dest||AU.sfx); o.start(t); o.stop(t+dur+.03);
}
function tone(f,dur,type,vol,when,slide){ if(!AU.c) return; toneAt(f,AU.c.currentTime+(when||0),dur,type||'sine',vol==null?.2:vol,AU.sfx,slide); }
function noiseAt(t,dur,vol,ftype,f0,f1,dest){
  const c=AU.c; if(!c) return;
  const s=c.createBufferSource(); s.buffer=AU.nb; s.loop=true;
  const f=c.createBiquadFilter(); f.type=ftype; f.frequency.setValueAtTime(f0,t);
  if(f1) f.frequency.exponentialRampToValueAtTime(f1,t+dur);
  const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(dest||AU.sfx); s.start(t,Math.random()*.5); s.stop(t+dur+.03);
}
function noise(dur,vol,when,ftype,f0,f1){ if(!AU.c) return; noiseAt(AU.c.currentTime+(when||0),dur,vol,ftype||'lowpass',f0||2000,f1); }
const hz=n=>523.25*Math.pow(2,n/12);
const _=null;
const MEL=[
 [0,_,4,_,7,_,9,7, 4,_,2,_,0,_,_,_, 4,_,7,_,9,12,9,7, 4,2,0,2,4,_,_,_],
 [7,_,9,7,4,_,2,0, 2,4,7,_,4,_,2,_, 0,_,4,7,12,_,9,7, 9,7,4,2,0,_,0,_]];
const ROOT=[-24,-27,-31,-29];
const SPB=60/136/2;
let step=0,nextT=0;
function sched(){
  const c=AU.c; if(!c||c.state!=='running') return;
  while(nextT<c.currentTime+.35){ playStep(step,nextT); nextT+=SPB; step=(step+1)%64; }
}
function playStep(s,t){
  const q=s&31, m=MEL[(s>>5)&1][q], chord=q>>3, g=s&7;
  if(m!==null){ toneAt(hz(m),t,.2,'square',.07,AU.mus); toneAt(hz(m+12),t,.12,'triangle',.05,AU.mus); }
  if(g%2===0){ const r=ROOT[chord]+((g===2||g===6)?7:0); toneAt(hz(r),t,.26,'triangle',.28,AU.mus); }
  if(g===0||g===4){ toneAt(150,t,.14,'sine',.5,AU.mus,45); }
  if(g===2||g===6){ noiseAt(t,.09,.18,'bandpass',1800,900,AU.mus); }
  noiseAt(t,.03,.05,'highpass',7000,null,AU.mus);
}
document.addEventListener('visibilitychange',()=>{ const c=AU.c; if(!c) return; if(document.hidden) c.suspend(); else c.resume(); });
const sfx={
  click(){ tone(660,.08,'triangle',.18); tone(990,.07,'triangle',.12,.04); },
  grab(){ tone(420,.1,'sine',.22,0,720); },
  drop(){ tone(140,.16,'sine',.5,0,60); noise(.08,.18,0,'lowpass',900); },
  thud(){ tone(90,.35,'sine',.7,0,38); noise(.2,.4,0,'lowpass',500,120); },
  splash(){ noise(.9,.45,0,'bandpass',600,2600); noise(.7,.3,.15,'highpass',1500,5000); for(let i=0;i<6;i++) tone(500+Math.random()*900,.1,'sine',.1,.05*i,1800); },
  bubble(){ tone(400+Math.random()*300,.09,'sine',.15,0,1100); },
  boing(){ tone(200,.35,'sine',.3,0,700); tone(700,.2,'sine',.2,.3,300); },
  hop(){ tone(300,.16,'triangle',.22,0,650); },
  cut(){ noise(.18,.4,0,'highpass',3000,9000); tone(1400,.12,'sawtooth',.12,0,300); },
  rustle(){ noise(.35,.3,0,'bandpass',3500,1800); noise(.3,.25,.1,'bandpass',4500,2500); },
  star(){ tone(1320,.18,'sine',.2); tone(1760,.2,'sine',.15,.08); },
  fall(){ tone(900,.9,'sine',.2,0,120); },
  bonk(){ tone(220,.12,'square',.2,0,90); },
  squeak(){ tone(1500,.07,'sine',.2,0,2300); tone(1900,.06,'sine',.18,.08,2600); },
  door(){ tone(160,.7,'sawtooth',.14,0,90); tone(120,.5,'sawtooth',.1,.3,70); },
  key(){ tone(2200,.15,'triangle',.18); tone(2900,.2,'triangle',.14,.09); tone(2200,.15,'triangle',.12,.2); },
  pop(){ tone(500,.1,'sine',.3,0,1300); },
  heart(){ tone(880,.2,'sine',.22); tone(1175,.3,'sine',.2,.12); },
  win(){ [0,4,7,12,7,12,16,19].forEach((n,i)=>{ tone(hz(n),.28,'square',.14,i*.13); tone(hz(n-12),.3,'triangle',.18,i*.13); }); },
  step(){ noise(.04,.08,0,'lowpass',700); },
  oops(){ tone(330,.18,'square',.16,0,200); tone(247,.3,'square',.16,.16,150); }
};

/* ---------- Drawing helpers ---------- */
const TAU=Math.PI*2, OUT='#4a250c';
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const easeOut=t=>1-Math.pow(1-t,3);
function rnd(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return (s-1)/2147483646; }; }
function ell(g,x,y,rx,ry,fill,stroke,lw,rot){ g.beginPath(); g.ellipse(x,y,rx,ry,rot||0,0,TAU); if(fill){g.fillStyle=fill;g.fill();} if(stroke){g.lineWidth=lw||3;g.strokeStyle=stroke;g.stroke();} }
function rr(g,x,y,w,h,r,fill,stroke,lw){ g.beginPath(); if(g.roundRect) g.roundRect(x,y,w,h,r); else g.rect(x,y,w,h); if(fill){g.fillStyle=fill;g.fill();} if(stroke){g.lineWidth=lw||3;g.strokeStyle=stroke;g.stroke();} }
function poly(g,pts,fill,stroke,lw){ g.beginPath(); pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); if(fill){g.fillStyle=fill;g.fill();} if(stroke){g.lineWidth=lw||3;g.lineJoin='round';g.strokeStyle=stroke;g.stroke();} }
function line(g,x1,y1,x2,y2,col,lw){ g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.strokeStyle=col; g.lineWidth=lw; g.lineCap='round'; g.stroke(); }
function star5(g,x,y,r,fill){ g.beginPath(); for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5, rad=i%2?r*.45:r; g.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad);} g.closePath(); g.fillStyle=fill||'#ffd23f'; g.fill(); g.lineWidth=2; g.lineJoin='round'; g.strokeStyle=OUT; g.stroke(); }
function speech(g,x,y,text,alpha,size){
  size=size||20; g.save(); g.globalAlpha=alpha==null?1:alpha;
  g.font='800 '+size+'px "Baloo 2",system-ui,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
  const w=g.measureText(text).width+26, h=size+14;
  g.beginPath(); g.moveTo(x-7,y+h/2-2); g.lineTo(x+1,y+h/2+11); g.lineTo(x+9,y+h/2-2); g.fillStyle='#fff'; g.fill(); g.lineWidth=3; g.strokeStyle=OUT; g.lineJoin='round'; g.stroke();
  rr(g,x-w/2,y-h/2,w,h,h/2,'#fff',OUT,3);
  g.fillStyle='#fff'; g.fillRect(x-5,y+h/2-4,12,5);
  g.fillStyle=OUT; g.fillText(text,x,y+1); g.restore();
}

/* ---------- Characters ---------- */
function caveman(g,x,y,o){
  const s=o.s||1, dir=o.dir||1, t=o.t||0, fem=!!o.fem;
  const skin=o.skin||'#f2b27a', skinD=o.skinD||'#d9955f', fur=o.fur||'#d9822b', hair=o.hair||'#3a2210';
  const mov=o.moving?1:0, w=o.walk||0, sw=Math.sin(w)*mov;
  const bob=mov?-Math.abs(Math.cos(w))*4:Math.sin(t*2.4)*1.1;
  const rot=o.rot||0, sink=o.sink||0, al=o.alpha==null?1:o.alpha;
  g.save(); g.globalAlpha=al;
  if(!o.noShadow) ell(g,x,y+2,26*s,7*s,'rgba(40,20,5,.25)');
  g.translate(x,y+sink); g.rotate(-rot*dir); g.scale(s*dir,s);
  g.lineCap='round'; g.lineJoin='round';
  const aF=o.armF!=null?o.armF:.12+sw*.75, aB=o.armB!=null?o.armB:-.12-sw*.75;
  const leg=(a,back)=>{ g.save(); g.translate(back?-6:6,-36+bob*.5); g.rotate(-a);
    g.strokeStyle=OUT; g.lineWidth=13; g.beginPath(); g.moveTo(0,0); g.lineTo(0,31); g.stroke();
    g.strokeStyle=back?skinD:skin; g.lineWidth=8.5; g.beginPath(); g.moveTo(0,0); g.lineTo(0,31); g.stroke();
    ell(g,4,35,10,5.5,back?skinD:skin,OUT,2.5); g.restore(); };
  const arm=(a,back)=>{ g.save(); g.translate(back?-6:6,-72+bob); g.rotate(-a);
    g.strokeStyle=OUT; g.lineWidth=12.5; g.beginPath(); g.moveTo(0,0); g.lineTo(0,26); g.stroke();
    g.strokeStyle=back?skinD:skin; g.lineWidth=8; g.beginPath(); g.moveTo(0,0); g.lineTo(0,26); g.stroke();
    ell(g,0,28,5.8,5.8,back?skinD:skin,OUT,2.5);
    if(!back&&(o.club||o.knife)){
      g.translate(0,28); g.rotate(a);
      if(o.club){ line(g,0,10,-3,-38,OUT,11); line(g,0,10,-3,-38,'#a0642a',6.5); ell(g,-4,-44,11,13,'#8a5222',OUT,2.5); }
      else drawKnife(g,6,-6,-.9,.8);
    }
    g.restore(); };
  arm(aB,true); leg(-sw*.75,true);
  if(fem){ g.beginPath(); g.moveTo(-12,-103+bob); g.quadraticCurveTo(-32,-80,-22,-48+bob); g.lineTo(2,-50+bob); g.lineTo(4,-96+bob); g.closePath(); g.fillStyle=hair; g.fill(); g.lineWidth=3; g.strokeStyle=OUT; g.stroke(); }
  // tunic
  const hw=fem?25:19, top=-78+bob, hem=-35+bob*.6;
  g.beginPath(); g.moveTo(-15,top); g.quadraticCurveTo(0,top-5,15,top); g.lineTo(hw,hem);
  for(let i=1;i<=6;i++) g.lineTo(hw-2*hw*i/6, hem+(i%2?0:9));
  g.closePath(); g.fillStyle=fur; g.fill(); g.lineWidth=3.2; g.strokeStyle=OUT; g.stroke();
  [[-6,-62],[8,-52],[-10,-46],[5,-70],[-1,-40]].forEach(p=>ell(g,p[0],p[1]+bob*.8,3.6,2.5,'#5a2d0c',null,0,.5));
  line(g,-16,-52+bob*.8,16,-52+bob*.8,'#6b3a17',4);
  if(!fem) line(g,-14,top+2,10,top+16,'#6b3a17',4);
  leg(sw*.75,false);
  // head
  const hy=-95+bob;

/* actors: smooth walking, jumping and fading driven by a small action queue */
function mkActor(x,y,o){ return Object.assign({x,y,dir:1,walk:0,v:0,moving:false,q:[],alpha:1,s:1,ride:false,airT:0},o||{}); }
function qWalk(a,x,y,sp){ a.q.push({k:'walk',x,y:y==null?a.y:y,sp:sp||190}); }
function qJump(a,x,y,dur,h){ a.q.push({k:'jump',x,y,dur:dur||.7,h:h||90}); }
function qDo(a,fn){ a.q.push({k:'do',fn}); }
function qWait(a,d){ a.q.push({k:'wait',d}); }
function qFade(a,d){ a.q.push({k:'fade',d}); }
function updActor(a,dt){
  const c=a.q[0];
  if(!c){ a.v*=Math.exp(-10*dt); a.moving=a.v>14; if(a.moving) a.walk+=a.v*dt*.075; return; }
  if(c.k==='walk'){
    const ty=a.ride?a.y:c.y, dx=c.x-a.x, dy=ty-a.y, d=Math.hypot(dx,dy);
    a.v=lerp(a.v,c.sp*clamp(d/40,.3,1),1-Math.exp(-9*dt));
    const st=Math.min(d,a.v*dt);
    if(d>.5){ a.x+=dx/d*st; a.y+=dy/d*st; if(Math.abs(dx)>.5) a.dir=dx>0?1:-1; }
    a.moving=true; a.walk+=a.v*dt*.075;
    a.stepT=(a.stepT||0)+a.v*dt; if(a.stepT>46){ a.stepT=0; sfx.step(); }
    if(d<=2){ if(!a.ride) a.y=c.y; a.x=c.x; a.q.shift(); }
  } else if(c.k==='jump'){
    if(c.t0==null){ c.t0=0; c.x0=a.x; c.y0=a.y; if(c.x>a.x) a.dir=1; else if(c.x<a.x) a.dir=-1; sfx.hop(); a.v=0; }
    c.t0+=dt; const p=clamp(c.t0/c.dur,0,1);
    a.x=lerp(c.x0,c.x,p); a.y=lerp(c.y0,c.y,p)-c.h*4*p*(1-p); a.moving=false; a.airT=p;
    if(p>=1){ a.q.shift(); a.airT=0; sfx.drop(); }
  } else if(c.k==='do'){ a.q.shift(); c.fn(); }
  else if(c.k==='wait'){ a.v*=Math.exp(-10*dt); a.moving=false; c.d-=dt; if(c.d<=0) a.q.shift(); }
  else if(c.k==='fade'){ c.p=(c.p||0)+dt/c.d; a.alpha=1-clamp(c.p,0,1); a.moving=false; if(c.p>=1) a.q.shift(); }
}

/* drag and drop */
function stagePt(e){ const r=stage.getBoundingClientRect(); return {x:(e.clientX-r.left)/r.width*960,y:(e.clientY-r.top)/r.height*540}; }
function startDrag(it,p){ if(G.drag) return; it.dragging=true; it.tw=null; G.drag={it,ox:it.x-p.x,oy:it.y-p.y}; cv.style.cursor='grabbing'; sfx.grab(); if(L.onGrab) L.onGrab(it); }
function pickAt(p){ let best=null,bd=1e9; for(const i of L.items){ if(i.vis===false||!i.active) continue; const d=Math.hypot(i.x-p.x,i.y-p.y); if(d<=i.r&&d<bd){best=i;bd=d;} } return best; }
function pointerDownAt(p){
  if(!L||G.scene!=='play') return;
  const it=pickAt(p);
  if(it) startDrag(it,p); else if(L.tap) L.tap(p);
}
function pointerMove(p){
  G.ptr=p;
  if(G.drag){ const it=G.drag.it; it.x=clamp(p.x+G.drag.ox,10,950); it.y=clamp(p.y+G.drag.oy,10,530); }
  else if(L&&G.scene==='play') cv.style.cursor=pickAt(p)?'grab':'default';
}
function pointerUp(){
  if(!G.drag) return;
  const it=G.drag.it; G.drag=null; it.dragging=false; cv.style.cursor='default';
  const ok=L.drop?L.drop(it):false;
  if(!ok&&it.home) it.tw={x0:it.x,y0:it.y,t:0};
}
cv.addEventListener('pointerdown',e=>{ e.preventDefault(); auInit(); const p=stagePt(e); G.ptr=p; try{cv.setPointerCapture(e.pointerId);}catch(err){} sfx.click(); pointerDownAt(p); });
addEventListener('pointermove',e=>pointerMove(stagePt(e)));
addEventListener('pointerup',pointerUp);
addEventListener('pointercancel',pointerUp);
slot.addEventListener('pointerdown',e=>{ e.preventDefault(); auInit(); if(L&&L.bagKnife) L.bagKnife(stagePt(e)); });

function updItems(dt){
  if(!L||!L.items) return;
  for(const it of L.items){
    if(it.tw){ it.tw.t+=dt*3.2; const p=easeOut(clamp(it.tw.t,0,1)); it.x=lerp(it.tw.x0,it.home.x,p); it.y=lerp(it.tw.y0,it.home.y,p); if(it.tw.t>=1){ it.tw=null; sfx.drop(); } }
  }
}
function drawItems(g){
  for(const it of L.items){
    if(it.vis===false) continue;
    if(it.active&&!it.dragging){
      g.save(); g.translate(it.x,it.y); g.rotate(G.t*.8); g.setLineDash([9,9]); g.lineWidth=3.5; g.strokeStyle='rgba(255,255,255,.9)';
      g.beginPath(); g.arc(0,0,it.r+4+Math.sin(G.t*4)*2,0,TAU); g.stroke(); g.restore();
    }
    g.save();
    if(it.dragging){ g.translate(it.x,it.y); g.scale(1.12,1.12); g.translate(-it.x,-it.y); }
    L.drawItem(g,it);
    g.restore();
  }
}

function startLevel(n){

function toTitle(){

  if(G.fade>0){ g.fillStyle='rgba(43,26,16,'+G.fade+')'; g.fillRect(0,0,960,540); }
}
let last=performance.now();
function frame(now){ const dt=Math.min(.05,Math.max(0,(now-last)/1000)); last=now; update(dt); draw(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.load){ document.fonts.load('800 20px "Baloo 2"'); }
</script>
